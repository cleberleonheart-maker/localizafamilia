name: Build APK nativo

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK de release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }} --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalizaFamilia-nativo
          path: android/app/build/outputs/apk/release/*.apk

      - name: Criar release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nativo-build-${{ github.run_number }}
          name: Localiza Família nativo build ${{ github.run_number }}
          generate_release_notes: false
          files: android/app/build/outputs/apk/release/*.apk

      - name: Publicar versão
        run: |
          echo "${{ github.run_number }}|1.${{ github.run_number }}|https://github.com/cleberleonheart-maker/localizafamilia/releases/download/nativo-build-${{ github.run_number }}/app-release.apk" > version
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add version
          git commit -m "version: build ${{ github.run_number }}" || true
          git push