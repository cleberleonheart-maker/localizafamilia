name: Publicar regras Firebase

on:
  push:
    branches: [ main ]
    paths:
      - 'database.rules.json'
      - 'firebase.json'
      - '.github/workflows/firebase-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Detectar projectId do config.js
        id: pid
        run: |
          PID=$(sed -n 's/.*projectId: *"\([^"]*\)".*/\1/p' config.js)
          echo "pid=$PID" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Publicar regras do banco
        if: env.FIREBASE_TOKEN != ''
        run: |
          firebase deploy --project "${{ steps.pid.outputs.pid }}" --only database --token "$FIREBASE_TOKEN" --non-interactive