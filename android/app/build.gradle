plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def senhaKs = System.getenv('LFKS_PASS') ?: 'localiza123'
def lfKs = rootProject.file('keystore/lf.keystore')

android {
    namespace 'com.localizafamilia.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.localizafamilia.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (lfKs.exists()) {
                storeFile lfKs
                storePassword senhaKs
                keyAlias 'lf'
                keyPassword senhaKs
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (lfKs.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}