<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Localiza Família</title>
<meta name="description" content="Localize seus filhos e familiares em tempo real">
<meta name="theme-color" content="#1A237E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --azul: #1A237E;
    --azul-claro: #3949AB;
    --fundo: #0F1526;
    --cartao: #1A2238;
    --texto: #E8EAF6;
    --verde: #2ECC71;
    --vermelho: #E74C3C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif; background: var(--fundo); color: var(--texto); }
  #mapa { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; }
  .painel {
    position: fixed; z-index: 1000; left: 50%; transform: translateX(-50%);
    width: min(94%, 420px); background: var(--cartao); border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); padding: 14px 16px;
  }
  .topo { top: 12px; display: flex; align-items: center; gap: 10px; }
  .topo .titulo { font-weight: 700; font-size: 16px; }
  .topo .subtitulo { font-size: 12px; opacity: .7; }
  .status-ponto { width: 16px; height: 16px; border-radius: 50%; }
  .status-ponto.ligado { background: var(--verde); box-shadow: 0 0 10px var(--verde); }
  .status-ponto.desligado { background: var(--vermelho); }
  .rodape { bottom: 12px; display: flex; gap: 10px; align-items: center; }
  .rodape .info { flex: 1; font-size: 11px; opacity: .75; line-height: 1.4; }
  button {
    background: var(--azul-claro); color: #fff; border: 0; border-radius: 10px;
    padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.desativado { opacity: .4; }
  .lista {
    position: fixed; z-index: 1000; left: 50%; transform: translateX(-50%);
    bottom: 86px; width: min(94%, 420px); max-height: 40vh; overflow-y: auto;
    background: var(--cartao); border-radius: 16px; padding: 10px 16px; display: none;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  .lista.visivel { display: block; }
  .item-familia { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .item-familia:last-child { border-bottom: 0; }
  .item-familia .nome { flex: 1; font-weight: 600; font-size: 14px; }
  .item-familia .distancia { font-size: 12px; color: var(--verde); }
  .item-familia .tempo { font-size: 11px; opacity: .6; }
  .marcador-eu .pin { background: var(--azul-claro); }
  .pin {
    width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    background: var(--vermelho); border: 3px solid #fff; display: flex; align-items: center; justify-content: center;
  }
  .pin span { transform: rotate(45deg); font-size: 13px; }
  .campo-nome { display: none; }
  .campo-nome input {
    width: 100%; background: #0F1526; border: 1px solid rgba(255,255,255,.2);
    color: var(--texto); border-radius: 10px; padding: 10px 12px; font-size: 14px;
  }
  .painel.lugares { bottom: 86px; background: #232C47; }
  .item-lugar {
    display: flex; align-items: center; gap: 8px; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,.08); font-size: 13px;
  }
  .item-lugar:last-child { border-bottom: 0; }
  .item-lugar .nome { flex: 1; font-weight: 600; }
  .item-lugar .linha { font-size: 11px; opacity: .6; }
  .item-lugar .remover { background: transparent; color: var(--vermelho); padding: 4px 8px; }
  .alerta {
    position: fixed; z-index: 3000; top: 74px; left: 50%; transform: translateX(-50%);
    width: min(94%, 420px); background: #FFC107; color: #000; border-radius: 10px;
    padding: 10px 14px; font-weight: 600; text-align: center; font-size: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,.4); display: none;
  }
  .alerta.visivel { display: block; }
  button.sos {
    position: fixed; z-index: 1500; bottom: 92px; left: 12px;
    width: 58px; height: 58px; border-radius: 50%; background: var(--vermelho);
    color: #fff; font-size: 15px; font-weight: 800; border: 3px solid #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,.45);
  }
  button.sos:active { transform: scale(.92); }
  button.btn-mic {
    position: fixed; z-index: 1500; bottom: 92px; right: 12px;
    width: 58px; height: 58px; border-radius: 50%; background: #3949AB;
    color: #fff; font-size: 22px; border: 3px solid #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,.45);
  }
  button.btn-mic.ativo { background: var(--verde); animation: pulsar 1s infinite; }
  button.btn-mic:active { transform: scale(.92); }
  .item-familia .rota {
    background: transparent; border: 1px solid rgba(255,255,255,.25);
    color: var(--texto); padding: 4px 8px; font-size: 11px; border-radius: 8px;
  }
  .sos-tela {
    position: fixed; z-index: 5000; inset: 0; background: rgba(120,0,0,.55);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .sos-bx {
    background: var(--vermelho); color: #fff; border-radius: 18px; width: min(94%, 360px);
    padding: 22px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.6);
    animation: pulsar 1s infinite;
  }
  @keyframes pulsar { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  .sos-titulo { font-size: 34px; font-weight: 900; letter-spacing: 2px; }
  .sos-nome { font-size: 20px; font-weight: 700; margin: 8px 0 2px; }
  .sos-info { font-size: 13px; opacity: .9; margin-bottom: 16px; }
  .sos-bx button {
    background: #fff; color: var(--vermelho); border-radius: 10px;
    padding: 10px 14px; font-weight: 700; margin: 4px;
  }
  .sos-bx .reconhecer { background: transparent; color: #fff; border: 2px solid #fff; }
  .painel.chat { bottom: 86px; background: #232C47; }
  .chat-msgs { max-height: 30vh; overflow-y: auto; padding: 4px 0; }
  .msg { margin: 6px 0; padding: 7px 10px; border-radius: 12px; background: #0F1526; font-size: 13px; }
  .msg.minha { background: var(--azul-claro); align-self: flex-end; margin-left: 30px; }
  .msg .quem { font-weight: 700; font-size: 11px; opacity: .75; }
  .msg .quando { font-size: 10px; opacity: .5; margin-left: 6px; }
  .msg .texto { margin-top: 2px; }
  .chat-input { display: flex; gap: 8px; margin-top: 8px; }
  .chat-input input {
    flex: 1; background: #0F1526; border: 1px solid rgba(255,255,255,.2);
    color: var(--texto); border-radius: 10px; padding: 9px 12px; font-size: 14px;
  }
  .status-row { display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 6px; }
  .status-row button {
    background: transparent; border: 1px solid rgba(255,255,255,.25);
    padding: 5px 8px; font-size: 12px; border-radius: 999px;
  }
  .status-row button.ativo { background: var(--azul-claro); border-color: var(--azul-claro); }
  button.oculto-ativo { opacity: 1; box-shadow: 0 0 8px var(--vermelho); }
  .painel.topo button { padding: 8px 6px; font-size: 12px; }
  .login-tela {
    position: fixed; z-index: 9000; inset: 0; background: rgba(6,10,25,.92);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-bx {
    background: var(--cartao); border-radius: 18px; width: min(94%, 360px);
    padding: 24px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  .login-titulo { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .login-info { font-size: 13px; opacity: .8; margin-bottom: 16px; }
  .login-modos {
    display: flex; gap: 8px; margin-bottom: 12px;
    background: #0F1526; border-radius: 10px; padding: 4px;
  }
  .login-modo {
    flex: 1; border-radius: 8px; padding: 8px 4px; font-size: 13px;
    background: transparent; color: rgba(255,255,255,.55); border: none;
  }
  .login-modo.ativo { background: var(--verde); color: #fff; font-weight: 700; }
  .login-modo:disabled { opacity: .4; }
  .login-bx input {
    width: 100%; background: #0F1526; border: 1px solid rgba(255,255,255,.2);
    color: var(--texto); border-radius: 10px; padding: 11px 12px; font-size: 15px;
    text-align: center; margin-bottom: 12px;
  }
  .login-bx button { width: 100%; }
  .login-aviso { color: var(--vermelho); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .painel.tarefas { bottom: 86px; background: #232C47; }
  .item-tarefa {
    display: flex; align-items: flex-start; gap: 8px; padding: 9px 0;
    border-bottom: 1px solid rgba(255,255,255,.08); font-size: 13px;
  }
  .item-tarefa:last-child { border-bottom: 0; }
  .item-tarefa .check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid rgba(255,255,255,.35); flex-shrink: 0; cursor: pointer; display:flex; align-items:center; justify-content:center; font-size: 13px; }
  .item-tarefa .check.feita { background: var(--verde); border-color: var(--verde); color: #000; }
  .item-tarefa .txt { flex: 1; }
  .item-tarefa .txt.feita { text-decoration: line-through; opacity: .55; }
  .item-tarefa .linha { font-size: 10px; opacity: .55; margin-top: 2px; }
  .tarefa-input { display: flex; gap: 8px; margin-top: 8px; }
  .tarefa-input input {
    flex: 1; background: #0F1526; border: 1px solid rgba(255,255,255,.2);
    color: var(--texto); border-radius: 10px; padding: 9px 12px; font-size: 14px;
  }
</style>
</head>
<body>

<div id="mapa"></div>

<div class="painel topo">
  <div class="status-ponto desligado" id="statusPonto"></div>
  <div style="flex:1">
    <div class="titulo">Localiza Família</div>
    <div class="subtitulo" id="statusTexto">Aguardando permissão de localização...</div>
  </div>
  <button id="btnFamilia" class="desativado">Família</button>
  <button id="btnLugar" title="Cercas de aviso">📌</button>
  <button id="btnChat" title="Chat em família">💬</button>
  <button id="btnTarefas" title="Tarefas da família">📋</button>
  <button id="btnInvisivel" title="Modo invisível" class="desativado">🌙</button>
  <button id="btnApk" title="Baixar versão Android (APK)">📦</button>
</div>

<div class="alerta" id="alerta"></div>

<div class="painel lugares" id="painelLugares">
  <div style="font-weight:700;margin-bottom:8px">Cercas de aviso 📌</div>
  <button id="btnAddLugar" style="width:100%;margin-bottom:6px">Adicionar lugar (onde estou)</button>
  <div id="listaLugares"></div>
</div>

<button class="sos" id="btnSos" title="Pedido de ajuda">SOS</button>
<button class="btn-mic" id="btnMic" title="Assistente de voz">🎤</button>

<div class="painel chat" id="painelChat">
  <div style="font-weight:700;margin-bottom:8px">Chat em família 💬</div>
  <div id="chatMsgs" class="chat-msgs"></div>
  <div class="chat-input">
    <input id="chatTexto" placeholder="Escreva uma mensagem..." maxlength="300">
    <button id="chatEnviar">Enviar</button>
  </div>
</div>

<div class="painel tarefas" id="painelTarefas">
  <div style="font-weight:700;margin-bottom:8px">Tarefas da família 📋</div>
  <div id="listaTarefas"></div>
  <div class="tarefa-input">
    <input id="tarefaTexto" placeholder="Nova tarefa (ex: comprar pão)..." maxlength="200">
    <button id="tarefaEnviar">Add</button>
  </div>
</div>

<div class="login-tela" id="loginTela">
  <div class="login-bx">
    <div class="login-titulo">🔒 Localiza Família</div>
    <div class="login-info" id="loginInfo">Verificando...</div>
    <div class="login-modos" id="loginModos">
      <button class="login-modo ativo" id="loginModoEntrar">Entrar</button>
      <button class="login-modo" id="loginModoCriar">Criar senha</button>
    </div>
    <input type="password" id="loginSenha" placeholder="Senha da família" autocomplete="off">
    <button id="loginEntrar">Continuar</button>
    <div class="login-aviso" id="loginAviso"></div>
  </div>
</div>

<div class="sos-tela" id="sosTela" style="display:none">
  <div class="sos-bx">
    <div class="sos-titulo">⚠️ SOS</div>
    <div class="sos-nome" id="sosNome"></div>
    <div class="sos-info" id="sosInfo"></div>
    <p style="font-size:13px;margin-bottom:12px">Essa pessoa pediu ajuda</p>
    <button id="sosMapa">Ver no mapa</button>
    <br>
    <button class="reconhecer" id="sosOk">OK, entendi</button>
  </div>
</div>

<div class="lista" id="listaFamilia"></div>

<div class="campo-nome" id="campoNome" style="bottom:86px">
  <input id="inputNome" placeholder="Seu nome (ex: Mamãe)">
</div>

<div class="painel rodape">
  <button id="btnCentralizar">Minha posição</button>
  <div class="info" id="info">Localização: —<br>Precisão: —</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref as dbRef, serverTimestamp as fbServerTimestamp, set, update, push, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const FIREBASE_CONFIGURADO = true;

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD-M6KylszDVnhXZOKq1sq-yAGaxY58oGc",
  authDomain: "localizafamilia.firebaseapp.com",
  databaseURL: "https://localizafamilia-default-rtdb.firebaseio.com",
  projectId: "localizafamilia"
};

const MINUTO = 60000;

const mapa = L.map("mapa").setView([-15.78, -47.92], 13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap"
}).addTo(mapa);

const statusPonto = document.getElementById("statusPonto");
const statusTexto = document.getElementById("statusTexto");
const info = document.getElementById("info");
const btnCentralizar = document.getElementById("btnCentralizar");
const btnFamilia = document.getElementById("btnFamilia");
const listaFamilia = document.getElementById("listaFamilia");
const campoNome = document.getElementById("campoNome");
const inputNome = document.getElementById("inputNome");

let minhaPosicao = null;
let meuMarcador = null;
let meuCirculo = null;

const iconeEu = L.divIcon({
  className: "",
  html: `<div class="marcador-eu"><div class="pin"><span>🏠</span></div></div>`,
  iconSize: [30, 30],
  iconAnchor: [15, 30]
});
const iconeMembro = L.divIcon({
  className: "",
  html: `<div class="pin"><span>👤</span></div>`,
  iconSize: [30, 30],
  iconAnchor: [15, 30]
});

const membros = new Map();

function distanciaEmKm(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const la1 = a.lat * Math.PI / 180;
  const la2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function estaConfigurado() {
  return FIREBASE_CONFIGURADO && FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("SUA-");
}

function abrirFirebase() {
  const app = initializeApp(FIREBASE_CONFIG);
  return getDatabase(app);
}

btnFamilia.addEventListener("click", () => {
  if (!estaConfigurado()) return;
  listaFamilia.classList.toggle("visivel");
  painelLugares.classList.remove("visivel");
  campoNome.style.display = "none";
});

document.getElementById("btnApk").addEventListener("click", () => {
  window.open("LocalizaFamilia-v1.0.apk", "_blank");
});

const painelLugares = document.getElementById("painelLugares");
const listaLugares = document.getElementById("listaLugares");
const btnAddLugar = document.getElementById("btnAddLugar");
const alerta = document.getElementById("alerta");

let lugares = JSON.parse(localStorage.getItem("lugares") || "[]");
const estadoCerca = new Map();

document.getElementById("btnLugar").addEventListener("click", () => {
  painelLugares.classList.toggle("visivel");
  listaFamilia.classList.remove("visivel");
  campoNome.style.display = "none";
  renderizarLugares();
});

function salvarLugares() {
  localStorage.setItem("lugares", JSON.stringify(lugares));
}

function notificar(msg) {
  alerta.textContent = msg;
  alerta.classList.add("visivel");
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  clearTimeout(alerta._t);
  alerta._t = setTimeout(() => alerta.classList.remove("visivel"), 9000);
}

function renderizarLugares() {
  if (lugares.length === 0) {
    listaLugares.innerHTML = "<div style='font-size:12px;opacity:.7;padding:6px 0'>Nenhum lugar ainda. Adicione um para ganhar aviso quando alguém chega ou sai.</div>";
    return;
  }
  listaLugares.innerHTML = lugares.map((l, i) => `
    <div class="item-lugar">
      <div style="flex:1">
        <div class="nome">${l.nome}</div>
        <div class="linha">${l.lat.toFixed(5)}, ${l.lng.toFixed(5)} · raio ${l.raio} m</div>
      </div>
      <button class="remover" data-i="${i}">✕</button>
    </div>`).join("");
  listaLugares.querySelectorAll(".remover").forEach((b) => {
    b.addEventListener("click", () => {
      lugares.splice(parseInt(b.dataset.i, 10), 1);
      salvarLugares();
      renderizarLugares();
    });
  });
}

btnAddLugar.addEventListener("click", () => {
  if (!minhaPosicao) {
    notificar("Posição ainda não disponível. Aguarde e tente de novo.");
    return;
  }
  const nome = prompt("Nome do lugar (ex: Casa):");
  if (!nome || !nome.trim()) return;
  const raio = parseInt(prompt("Distância em metros do aviso (ex: 300):", "300"), 10) || 300;
  lugares.push({
    id: Date.now(),
    nome: nome.trim(),
    lat: minhaPosicao.lat,
    lng: minhaPosicao.lng,
    raio
  });
  salvarLugares();
  renderizarLugares();
  notificar(`Lugar "${nome.trim()}" criado na sua posição`);
});

function dentroDoLugar(lugar, lat, lng) {
  return distanciaEmKm(lugar, { lat, lng }) * 1000 <= lugar.raio;
}

function verificarCercas() {
  if (lugares.length === 0) return;
  const todos = [];
  if (minhaPosicao) {
    todos.push({ nome: localStorage.getItem("nomeFamiliar") || "Eu", lat: minhaPosicao.lat, lng: minhaPosicao.lng });
  }
  membros.forEach((m) => todos.push({ nome: m.nome, lat: m.lat, lng: m.lng }));
  lugares.forEach((lugar) => {
    todos.forEach((p) => {
      const dentro = dentroDoLugar(lugar, p.lat, p.lng);
      const chave = `${p.nome}|${lugar.id}`;
      const antes = estadoCerca.get(chave);
      if (antes !== undefined && antes !== dentro) {
        notificar(`${p.nome} ${dentro ? "chegou em" : "saiu de"} ${lugar.nome}`);
      }
      estadoCerca.set(chave, dentro);
    });
  });
}

inputNome.addEventListener("change", () => {
  const nome = inputNome.value.trim();
  if (nome.length > 0) {
    localStorage.setItem("nomeFamiliar", nome);
    campoNome.style.display = "none";
    registrarNoFirebase();
  }
});

function atualizarInterface() {
  if (minhaPosicao) {
    info.innerHTML = `Localização: ${minhaPosicao.lat.toFixed(6)}, ${minhaPosicao.lng.toFixed(6)}<br>Precisão: ±${Math.round(minhaPosicao.acuracia)} m`;
  }
  if (estaConfigurado() && !localStorage.getItem("nomeFamiliar")) {
    campoNome.style.display = "block";
  }
  if (estaConfigurado()) {
    btnFamilia.classList.remove("desativado");
    btnFamilia.textContent = `Família (${membros.size})`;
  }
}

let enviandoFirebase = false;
let modoInvisivel = localStorage.getItem("invisivel") === "1";
let meuStatus = localStorage.getItem("status") || "";
let ultimaBateria = localStorage.getItem("bateria") || null;

const STATUS_OPCOES = [
  { id: "casa", icone: "🏠", nome: "Em casa" },
  { id: "caminho", icone: "🚗", nome: "A caminho" },
  { id: "escola", icone: "🎒", nome: "Na escola" },
  { id: "ocupado", icone: "💼", nome: "Ocupado" }
];

function chaveNome(nome) {
  return nome.replace(/[^a-zA-Z0-9-_]/g, "_");
}

function registrarNoFirebase() {
  if (!estaConfigurado() || !minhaPosicao) return;
  if (enviandoFirebase) return;
  enviandoFirebase = true;
  const nome = localStorage.getItem("nomeFamiliar") || "Familiar";
  const db = abrirFirebase();
  const minha = dbRef(db, `familia/${chaveNome(nome)}`);
  const dados = {
    nome,
    lat: minhaPosicao.lat,
    lng: minhaPosicao.lng,
    atualizado: fbServerTimestamp()
  };
  if (modoInvisivel) dados.invisivel = true;
  if (meuStatus) dados.status = meuStatus;
  if (ultimaBateria !== null) dados.bateria = ultimaBateria;
  update(minha, dados).finally(() => { enviandoFirebase = false; });
}

function escutarFamilia() {
  if (!estaConfigurado()) return;
  const db = abrirFirebase();
  const lista = query(dbRef(db, "familia"), limitToLast(100));
  onValue(lista, (snap) => {
    membros.clear();
    const dados = snap.val() || {};
    Object.values(dados).forEach((m) => {
      if (m && typeof m.lat === "number" && typeof m.lng === "number" && !m.invisivel) {
        membros.set(m.nome, m);
        atualizarMarcadorDoMembro(m);
        ligarHistoricoDe(m.nome.replace(/[^a-zA-Z0-9-_]/g, "_"));
      }
    });
    atualizarInterface();
    renderizarFamilia();
    verificarCercas();
  });
}

const marcadoresMembros = new Map();

function atualizarMarcadorDoMembro(m) {
  const popup = (m.status || m.bateria !== undefined)
    ? `<b>${m.nome}</b><br>${m.status ? iconeStatus(m.status) + " " + nomeStatus(m.status) : ""}${m.bateria !== undefined ? " · 🔋" + m.bateria + "%" : ""}`
    : `<b>${m.nome}</b>`;
  const existente = marcadoresMembros.get(m.nome);
  if (existente) {
    existente.setLatLng([m.lat, m.lng]);
    existente.bindPopup(popup);
  } else {
    const marcador = L.marker([m.lat, m.lng], { icon: iconeMembro })
      .addTo(mapa)
      .bindPopup(popup);
    marcadoresMembros.set(m.nome, marcador);
  }
}

function iconeStatus(id) {
  const s = STATUS_OPCOES.find((x) => x.id === id);
  return s ? s.icone : "";
}

function nomeStatus(id) {
  const s = STATUS_OPCOES.find((x) => x.id === id);
  return s ? s.nome : id;
}

function renderizarFamilia() {
  const meuNome = localStorage.getItem("nomeFamiliar") || "";
  const html = [];
  html.push(`
    <div class="status-row">
      ${STATUS_OPCOES.map((s) => `
        <button class="${meuStatus === s.id ? "ativo" : ""}" data-status="${s.id}">
          ${s.icone} ${s.nome}
        </button>`).join("")}
      <button data-missao="compartilhar">📤 Aqui</button>
      <button data-missao="sair">🔒 Sair</button>
    </div>`);
  if (minhaPosicao) {
    html.push(`
      <div class="item-familia">
        <div class="nome">${meuNome || "Eu"} (eu)${meuStatus ? " " + iconeStatus(meuStatus) : ""}${ultimaBateria !== null ? " · 🔋" + ultimaBateria + "%" : ""}${modoInvisivel ? " · 🌙 oculto" : ""}</div>
        <div class="tempo">agora</div>
        <button class="rota" data-nome="${meuNome || "Eu"}">Rota</button>
      </div>`);
  }
  membros.forEach((m) => {
    if (m.nome === meuNome) return;
    const dist = minhaPosicao ? distanciaEmKm(minhaPosicao, m) : 0;
    html.push(`
      <div class="item-familia">
        <div class="nome">${m.nome}${m.status ? " " + iconeStatus(m.status) : ""}${m.bateria !== undefined ? " · 🔋" + m.bateria + "%" : ""}</div>
        <div class="distancia">${minhaPosicao ? dist.toFixed(1) + " km" : "—"}</div>
        <button class="rota" data-nome="${m.nome}">Rota</button>
      </div>`);
  });
  listaFamilia.innerHTML = html.length > 0 ? html.join("") : "<div style='padding:8px 0;font-size:12px;opacity:.6'>Nenhum familiar conectado.</div>";
  listaFamilia.querySelectorAll(".rota").forEach((b) => {
    b.addEventListener("click", () => verRota(b.dataset.nome));
  });
  listaFamilia.querySelectorAll("[data-status]").forEach((b) => {
    b.addEventListener("click", () => definirStatus(b.dataset.status));
  });

    b.addEventListener("click", () => {
      if (b.dataset.missao === "compartilhar") compartilharLink();
      if (b.dataset.missao === "sair") sairFamilia();

function definirStatus(id) {
  meuStatus = meuStatus === id ? "" : id;

    set(dbRef(db, `familia/${chaveNome(localStorage.getItem("nomeFamiliar"))}/status`), meuStatus).catch(() => {});
  }
  renderizarFamilia();
}

const historicoLocal = JSON.parse(localStorage.getItem("hist") || "[]");
const trilhaMembros = new Map();

function meiaNoiteHoje() {
  const agora = new Date();
  return new Date(agora.getFullYear(), agora.getMonth(), agora.getDate()).getTime();
}

function guardarHistorico() {
  if (!minhaPosicao) return;
  const agora = Date.now();
  const ult = historicoLocal[historicoLocal.length - 1];
  if (ult && agora - ult.t < 30000 && distanciaEmKm(ult, minhaPosicao) * 1000 < 40) return;
  historicoLocal.push({ t: agora, lat: minhaPosicao.lat, lng: minhaPosicao.lng });
  if (historicoLocal.length > 3000) historicoLocal.splice(0, historicoLocal.length - 3000);
  localStorage.setItem("hist", JSON.stringify(historicoLocal));
}

function enviarHistoricoFirebase() {
  if (!estaConfigurado() || !minhaPosicao) return;
  const nome = localStorage.getItem("nomeFamiliar");
  if (!nome) return;
  const chave = nome.replace(/[^a-zA-Z0-9-_]/g, "_");
  const db = abrirFirebase();
  set(dbRef(db, `historico/${chave}/${Date.now()}`), {
    lat: minhaPosicao.lat,
    lng: minhaPosicao.lng,
    t: Date.now()
  }).catch(() => {});
}

function ligarHistoricoDe(chave) {
  if (!estaConfigurado() || trilhaMembros.has(chave)) return;
  const db = abrirFirebase();
  onValue(dbRef(db, `historico/${chave}`), (snap) => {
    const valores = snap.val() || {};
    const pontos = Object.values(valores)
      .filter((p) => p && typeof p.lat === "number" && typeof p.lng === "number")
      .sort((a, b) => a.t - b.t);
    trilhaMembros.set(chave, pontos);
  });
}

function verRota(nome) {
  const ehEu = nome === (localStorage.getItem("nomeFamiliar") || "Eu");
  if (ehEu) {
    desenharTrilha(historicoLocal.filter((p) => p.t >= meiaNoiteHoje()), nome);
    return;
  }
  const chave = nome.replace(/[^a-zA-Z0-9-_]/g, "_");
  ligarHistoricoDe(chave);
  const pontos = trilhaMembros.get(chave);
  desenharTrilha((pontos || []).filter((p) => p.t >= meiaNoiteHoje()), nome);
}

let camadaTrilha = null;

function desenharTrilha(pontos, nome) {
  if (camadaTrilha) {
    mapa.removeLayer(camadaTrilha);
    camadaTrilha = null;
  }
  if (!pontos.length) {
    notificar(`Sem pontos registrados hoje para ${nome} ainda.`);
    return;
  }
  camadaTrilha = L.layerGroup().addTo(mapa);
  L.polyline(pontos.map((p) => [p.lat, p.lng]), { color: "#FF9800", weight: 4 }).addTo(camadaTrilha);
  L.circleMarker([pontos[0].lat, pontos[0].lng], { color: "#2ECC71", radius: 8 })
    .addTo(camadaTrilha).bindPopup("<b>Início do dia</b>");
  const ultimo = pontos[pontos.length - 1];
  L.circleMarker([ultimo.lat, ultimo.lng], { color: "#E74C3C", radius: 8 })
    .addTo(camadaTrilha).bindPopup(`<b>${nome}</b><br>último ponto`);
  mapa.fitBounds(L.latLngBounds(pontos.map((p) => [p.lat, p.lng])).pad(0.2));
  notificar(`Rota de ${nome}: ${pontos.length} pontos hoje`);
}

function tocarAlarme() {
  if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500, 200, 500]);
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    const bip = (atraso) => setTimeout(() => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.connect(g);
      g.connect(ctx.destination);
      osc.type = "square";
      osc.frequency.value = 880;
      g.gain.setValueAtTime(0.25, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
      osc.start();
      osc.stop(ctx.currentTime + 0.7);
    }, atraso);
    bip(0);
    bip(900);
    bip(1800);
  } catch (e) {}
}

function mostrarSos(dados) {
  ultimoSos = dados;
  sosNome.textContent = dados.nome || "Familiar";
  sosInfo.textContent = dados.t
    ? `às ${new Date(dados.t).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}`
    : "agora mesmo";
  sosTela.style.display = "flex";
  tocarAlarme();
  if (sosMarcador) mapa.removeLayer(sosMarcador);
  if (typeof dados.lat === "number" && typeof dados.lng === "number") {
    sosMarcador = L.marker([dados.lat, dados.lng], { icon: iconeMembro })
      .addTo(mapa)
      .bindPopup(`<b style="color:#E74C3C">⚠️ SOS — ${dados.nome || "Familiar"}</b>`);
    mapa.setView([dados.lat, dados.lng], 15);

}

const btnMic = document.getElementById("btnMic");
let micAtivo = false;
let reconVoz = null;

function falar(texto) {
  notificar("🎤 " + texto);
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const frase = new SpeechSynthesisUtterance(texto);
    frase.lang = "pt-BR";
    frase.rate = 1;
    speechSynthesis.speak(frase);
  } catch (e) {}
}

btnMic.addEventListener("click", () => {
  if (window.AndroidMic) {
    if (micAtivo) window.AndroidMic.parar();
    else window.AndroidMic.ouvir();
    return;
  }
  if (micAtivo) desligarMic();
  else ligarMic();
});

window.lfvoz = (t) => { processarComando(String(t || "").toLowerCase()); };
window.lfMic = (on) => { micAtivo = !!on; btnMic.classList.toggle("ativo", micAtivo); };

function ligarMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    notificar("Reconhecimento de voz não suportado neste navegador.");
    return;
  }
  micAtivo = true;
  btnMic.classList.add("ativo");
  falar("Pronta! Pode falar.");
  const r = new SR();
  reconVoz = r;
  r.lang = "pt-BR";
  r.continuous = true;
  r.interimResults = false;
  r.maxAlternatives = 3;
  const reiniciar = () => { if (micAtivo) { try { r.start(); } catch (e) {} } };
  r.onresult = (ev) => {
    const ultimo = ev.results[ev.results.length - 1];
    const texto = ((ultimo && ultimo[0] && ultimo[0].transcript) || "").trim().toLowerCase();
    if (texto) processarComando(texto);
  };
  r.onerror = (ev) => {
    if (ev.error === "not-allowed") {
      notificar("Permita o microfone do navegador.");
      desligarMic();
      return;
    }
    if (ev.error === "no-speech" || ev.error === "aborted" || ev.error === "network") {
      setTimeout(reiniciar, 800);
    }
  };
  r.onend = reiniciar;
  try { r.start(); } catch (e) {}
}

function desligarMic() {
  micAtivo = false;
  btnMic.classList.remove("ativo");
  if (reconVoz) { try { reconVoz.stop(); } catch (e) {} reconVoz = null; }
}

function processarComando(t) {
  if (/(?:^| )sos|socorro|emergencia|perigo/.test(t) && !/sair do sos/.test(t)) {
    const db = abrirFirebase();
    const dados = {
      nome: localStorage.getItem("nomeFamiliar") || "Familiar",
      lat: minhaPosicao ? minhaPosicao.lat : 0,
      lng: minhaPosicao ? minhaPosicao.lng : 0,
      t: Date.now()
    };
    set(dbRef(db, "sos/alerta"), dados).catch(() => {});
    ultimoSosEnviado = dados;
    falar("SOS enviado para a família!");
    return;
  }
  const mPesquisa = t.match(/(?:onde esta|cade|cadê|mostra rota|rota do|rota de)\s+([a-z\u00E0-\u00FF]+)/);
  if (mPesquisa) {
    localizarPorVoz(mPesquisa[1]);
    return;
  }
  if (/quem|status|bateria|todos|resumo/.test(t)) {
    lerResumoFamilia();
    return;
  }
  if (/adiciona lugar|cria lugar|novo lugar|criar lugar|marca lugar/.test(t)) {
    adicionarLugarVoz();
    return;
  }
  if (/cerca|lugares|onde estao meus lugares/.test(t)) {
    const nomes = lugares.length ? lugares.map((l) => l.nome).join(", ") : "nenhum lugar criado ainda";
    falar("Você tem " + (lugares.length || 0) + " lugares: " + nomes);
    return;
  }
  const mMensagem = t.match(/(?:manda mensagem|manda pra familia|avisa|fala pra familia|mensagem)\s+(.+)/);
  if (mMensagem) {
    enviarChatVoz(mMensagem[1]);
    return;
  }
  if (/para de ouvir|desliga|silenciar|chega/.test(t)) {
    desligarMic();
    falar("Desliguei o microfone.");
    return;
  }
  if (/ajuda|o que voce faz|comandos|o que voce sabe/.test(t)) {
    falar("Posso dizer onde está alguém, mandar SOS, criar lugar, ler status, bateria e mandar mensagens para a família.");
    return;
  }
  falar("Não entendi. Diga: cade o João, manda sos, criar lugar, resumo, bateria, ou manda mensagem e o texto.");
}

function localizarPorVoz(nome) {
  const ehEu = nome === "eu" || nome === "me";
  if (ehEu) {
    if (!minhaPosicao) { falar("Ainda sem minha posição."); return; }
    falar("Você está em latitude " + minhaPosicao.lat.toFixed(4) + ", longitude " + minhaPosicao.lng.toFixed(4) + ".");
    return;
  }
  const alvo = [...membros].find(([chave, m]) =>
    m.nome.toLowerCase().startsWith(nome) || nome.startsWith(m.nome.toLowerCase())
  );
  if (!alvo) { falar("Não achei " + nome + " conectado agora."); return; }
  const m = alvo[1];
  if (minhaPosicao) {
    const dist = distanciaEmKm(minhaPosicao, m);
    const texto = dist < 1
      ? Math.round(dist * 1000) + " metros"
      : dist.toFixed(1) + " quilômetros";
    mapa.setView([m.lat, m.lng], 15);
    falar(m.nome + " está a aproximadamente " + texto + " de você.");
  } else {
    mapa.setView([m.lat, m.lng], 15);
    falar(m.nome + " está no mapa agora.");
  }
}

function lerResumoFamilia() {
  const partes = [];
  if (modoInvisivel) partes.push((localStorage.getItem("nomeFamiliar") || "Você") + " em modo oculto");
  membros.forEach((m) => {
    let p = m.nome;
    if (m.status) p += ", " + nomeStatus(m.status);
    if (m.bateria !== undefined) p += ", bateria " + m.bateria + " por cento";
    partes.push(p);
  });
  falar(partes.length ? partes.join(". ") + "." : "Ninguém conectado no momento.");
}

function adicionarLugarVoz() {
  if (!minhaPosicao) { falar("Posição ainda não disponível."); return; }
  lugares.push({ id: Date.now(), nome: "Minha posição", lat: minhaPosicao.lat, lng: minhaPosicao.lng, raio: 300 });
  salvarLugares();
  renderizarLugares();
  falar("Lugar criado aqui, no raio de trezentos metros.");
}

function enviarChatVoz(texto) {
  const nome = localStorage.getItem("nomeFamiliar");
  if (!nome || !estaConfigurado()) return;
  const db = abrirFirebase();
  push(dbRef(db, "chat"), { nome, texto, t: Date.now() })
    .then(() => falar("Mensagem enviada."))
    .catch(() => falar("Não consegui enviar a mensagem."));
}

function atualizarBateria() {
  if (!navigator.getBattery) return;
  navigator.getBattery().then((b) => {
    const nivel = Math.round(b.level * 100);
    const mudou = String(nivel) !== localStorage.getItem("bateria");
    ultimaBateria = nivel;
    localStorage.setItem("bateria", nivel);
    if (mudou && estaConfigurado() && localStorage.getItem("nomeFamiliar")) {
      const db = abrirFirebase();
      set(dbRef(db, `familia/${chaveNome(localStorage.getItem("nomeFamiliar"))}/bateria`), nivel).catch(() => {});
      renderizarFamilia();
    }
  }).catch(() => {});
}

btnCentralizar.addEventListener("click", () => {
  if (minhaPosicao) mapa.setView([minhaPosicao.lat, minhaPosicao.lng], 15);
});

function iniciarApp() {
  navigator.geolocation.watchPosition((pos) => {
    const { latitude, longitude, accuracy } = pos.coords;
    minhaPosicao = { lat: latitude, lng: longitude, acuracia: accuracy };
    statusPonto.classList.add("ligado");
    statusPonto.classList.remove("desligado");
    statusTexto.textContent = "Rastreando sua posição";
    if (!meuMarcador) {
      meuMarcador = L.marker([latitude, longitude], { icon: iconeEu }).addTo(mapa).bindPopup("<b>Você</b>");
      meuCirculo = L.circle([latitude, longitude], { radius: accuracy, color: "#3949AB", fillOpacity: 0.15 }).addTo(mapa);
      mapa.setView([latitude, longitude], 15);
    } else {
      meuMarcador.setLatLng([latitude, longitude]);
      meuCirculo.setLatLng([latitude, longitude]);
      meuCirculo.setRadius(accuracy);
    }
    atualizarInterface();
    registrarNoFirebase();
    guardarHistorico();
    verificarCercas();
  }, (err) => {
    statusTexto.textContent = err.code === 1 ? "Permissão negada — ative a localização" : "Erro ao obter localização";
  }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });

  setInterval(() => {
    registrarNoFirebase();
    enviarHistoricoFirebase();
  }, 15000);

  setInterval(atualizarBateria, 60000);

  atualizarInterface();
  escutarFamilia();
  escutarSos();
  escutarChat();
  escutarTarefas();
  atualizarBateria();
  btnInvisivel.classList.toggle("oculto-ativo", modoInvisivel);

  const params = new URLSearchParams(location.search);
  const latLink = parseFloat(params.get("lat"));
  const lngLink = parseFloat(params.get("lng"));
  if (!isNaN(latLink) && !isNaN(lngLink)) {
    mapa.setView([latLink, lngLink], 16);
    L.marker([latLink, lngLink], { icon: iconeMembro })
      .addTo(mapa)
      .bindPopup("<b>Localização compartilhada</b>")
      .openPopup();
  }

  if (estaConfigurado() && localStorage.getItem("nomeFamiliar")) {
    ligarHistoricoDe(localStorage.getItem("nomeFamiliar").replace(/[^a-zA-Z0-9-_]/g, "_"));
  }
}

const loginTela = document.getElementById("loginTela");
const loginInfo = document.getElementById("loginInfo");
const loginSenha = document.getElementById("loginSenha");
const loginEntrar = document.getElementById("loginEntrar");
const loginAviso = document.getElementById("loginAviso");
const loginModoEntrar = document.getElementById("loginModoEntrar");
const loginModoCriar = document.getElementById("loginModoCriar");

let senhaFamilia = "";
let modoLogin = "";
let senhaVerificada = false;

function selecionarModo(modo) {
  modoLogin = modo;
  loginModoEntrar.classList.toggle("ativo", modo === "entrar");
  loginModoCriar.classList.toggle("ativo", modo === "criar");
  if (modo === "criar") {
    loginInfo.textContent = "Ainda não há senha. Crie a senha da família:";
    loginSenha.placeholder = "Crie uma senha";
  } else {
    loginInfo.textContent = "Digite a senha da família:";
    loginSenha.placeholder = "Senha da família";
  }
  loginAviso.textContent = "";
}

function verificarLogin() {
  if (!estaConfigurado() || localStorage.getItem("token")) {
    loginTela.style.display = "none";
    iniciarApp();
    return;
  }
  const db = abrirFirebase();
  onValue(dbRef(db, "familia/config/senha"),
    (snap) => {
      senhaVerificada = true;
      senhaFamilia = snap.exists() ? String(snap.val()) : "";
      loginModoCriar.disabled = !!senhaFamilia;
      loginModoEntrar.disabled = !senhaFamilia;
      selecionarModo(senhaFamilia ? "entrar" : "criar");
      loginTela.style.display = "flex";
      loginSenha.focus();
    },
    () => {
      senhaVerificada = false;
      selecionarModo("entrar");
      loginTela.style.display = "flex";
      loginAviso.textContent = "Não consegui verificar a senha. Confira as regras do Firebase.";
      loginSenha.focus();
    }
  );
}

loginEntrar.addEventListener("click", entrarFamilia);
loginSenha.addEventListener("keydown", (e) => {
  if (e.key === "Enter") entrarFamilia();
});
loginModoEntrar.addEventListener("click", () => selecionarModo("entrar"));
loginModoCriar.addEventListener("click", () => selecionarModo("criar"));

function entrarFamilia() {
  const senha = loginSenha.value.trim();
  if (!senha) return;
  if (modoLogin === "criar") {
    if (senhaVerificada && senhaFamilia) {
      loginAviso.textContent = 'Essa família já tem senha. Use "Entrar".';
      return;
    }
    const db = abrirFirebase();
    set(dbRef(db, "familia/config/senha"), senha)
      .then(() => {
        localStorage.setItem("token", senha);
        loginTela.style.display = "none";
        notificar("Senha da família criada!");
        iniciarApp();
      })
      .catch(() => { loginAviso.textContent = "Erro ao salvar senha."; });
  } else {
    if (!senhaVerificada) {
      loginAviso.textContent = "Aguarde a verificação da senha...";
      return;
    }
    if (senha === senhaFamilia) {
      localStorage.setItem("token", senha);
      loginTela.style.display = "none";
      iniciarApp();
    } else {
      loginAviso.textContent = "Senha errada. Tente de novo.";
      loginSenha.value = "";
      loginSenha.focus();
    }
  }
}

verificarLogin();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
